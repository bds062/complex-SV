name: complex-SV

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Shared with Severus.
  - python=3.11
  - samtools>=1.14
  - networkx>=3.0
  - pygraphviz
  - pydot
  - matplotlib-base>=3.7
  - biopython
  - numpy>=1.24,<3
  - pysam
  - plotly

  # complex-SV tabular and training dependencies.
  - pandas>=2.0,<4
  - scikit-learn>=1.3,<2
  - tqdm>=4.65

  # PyTorch and PyG are resolved from conda-forge; no pip phase is required.
  # This portable specification selects a CPU build when CUDA is not visible.
  - pytorch>=2.1,<3
  - torch-geometric>=2.5,<3
