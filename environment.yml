name: complex-SV

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Shared with Severus.
  - python=3.11
  - samtools>=1.14
  - networkx>=3.0
  - pygraphviz
  - pydot
  - matplotlib-base>=3.7
  - biopython
  - numpy>=1.24,<3
  - pysam
  - plotly

  # complex-SV tabular and training dependencies.
  - pandas>=2.0,<4
  - scikit-learn>=1.3,<2
  - tqdm>=4.65
  - pip>=23

  # Current PyTorch releases are installed as wheels. PyG's basic operators do
  # not require the optional compiled extension packages used by advanced PyG.
  - pip:
      - torch>=2.1,<3
      - torch-geometric>=2.5,<3
